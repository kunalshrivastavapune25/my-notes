AWSTemplateFormatVersion: "2010-09-09"

######################################################################
# 📘 Template Description
######################################################################
Description: >
  AWS CloudFormation – Simple Infrastructure Template.
  This template demonstrates how to:
    - Create a VPC
    - Add a Public Subnet
    - Attach an Internet Gateway
    - Configure a Route Table
    - Prepare the network for EC2 deployment

######################################################################
# 🔧 Parameters Section
# User-provided inputs (with defaults)
######################################################################
Parameters:

  #############################################################
  # 🧠 CIDR Reference:
  # https://www.ipaddressguide.com/cidr
  #############################################################

  VPCCIDR:
    Description: CIDR block for the VPC
    Type: String
    Default: 10.199.0.0/16
    AllowedValues:
      - 10.199.0.0/16

  PUBSUBNET1:
    Description: CIDR block for Public Subnet
    Type: String
    Default: 10.199.10.0/24
    AllowedValues:
      - 10.199.10.0/24

  PRIVSUBNET1:
    Description: CIDR block for Private Subnet (used later)
    Type: String
    Default: 10.199.20.0/24

  #############################################################
  # 🖥 EC2 Configuration
  #############################################################
  InstanceType:
    Description: EC2 instance type for Web Server
    Type: String
    Default: t2.nano
    AllowedValues:
      - t2.nano
      - t2.micro
      - t2.small
    ConstraintDescription: Must be a valid EC2 instance type.

  LatestAmiId:
    Description: Latest Amazon Linux 2 AMI (from SSM Parameter Store)
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

######################################################################
# 🏗 Resources Section
# Actual AWS resources are defined here
######################################################################
Resources:

  ####################################################################
  # 🧱 Step 1: Create VPC
  ####################################################################
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Lab1_VPC
        - Key: Application
          Value: !Ref AWS::StackId

  ####################################################################
  # 🌐 Step 2: Internet Gateway
  # 2.1 Create IGW
  # 2.2 Attach IGW to VPC
  # (Gateway ban gaya, ab VPC ke saath jodna padega 😄)
  ####################################################################
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    DependsOn: VPC
    Properties:
      Tags:
        - Key: Name
          Value: Lab1_IG
        - Key: Application
          Value: !Ref AWS::StackId

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    DependsOn: InternetGateway
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  ####################################################################
  # 🌍 Step 3: Public Subnet
  # MapPublicIpOnLaunch = true → instances get public IP
  ####################################################################
  Subnet:
    Type: AWS::EC2::Subnet
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PUBSUBNET1
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      Tags:
        - Key: Name
          Value: Lab1_Public_Subnet
        - Key: Application
          Value: !Ref AWS::StackId

  ####################################################################
  # 🚦 Step 4: Route Table
  # - Create Route Table
  # - Add Route to Internet Gateway
  # - Associate with Public Subnet
  ####################################################################
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Lab1_Public_RouteTable
        - Key: Application
          Value: !Ref AWS::StackId

  # Default route to Internet (0.0.0.0/0 → IGW)
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Associate Route Table with Public Subnet
  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn:
      - Subnet
      - PublicRouteTable
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref PublicRouteTable

 
######################################################################
# 🔐 Step 3.3: Network ACL for Public Subnet
# Network ACLs are:
# - Stateless (response traffic must be explicitly allowed)
# - Evaluated by rule number (lowest first)
# - Applied at SUBNET level , also NACL is only outside traffic nor intra resouces traffic
######################################################################

  PublicNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    DependsOn:
      - VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Lab1_Public_NACL
        - Key: Application
          Value: !Ref AWS::StackId

  ####################################################################
  # 🚪 INBOUND RULES (Ingress)
  ####################################################################

  # Allow HTTP traffic from anywhere (Web access)
  InboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Protocol: 6               # TCP
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  # Allow SSH access (Admin access – exam favorite)
  InboundSSH:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Protocol: 6               # TCP
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 22
        To: 22

  # Allow Ephemeral ports (IMPORTANT for stateless NACL)
  # Required for response traffic from outbound requests
  InboundEphemeralPorts:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 120
      Protocol: 6               # TCP
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  ####################################################################
  # 🚀 OUTBOUND RULES (Egress)
  ####################################################################

  # Allow outbound HTTP
  OutboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 100
      Protocol: 6               # TCP
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  # Allow outbound HTTPS (updates, yum, APIs, etc.)
  OutboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 110
      Protocol: 6               # TCP
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  # Allow outbound Ephemeral ports
  # Stateless nature → response ports must be explicitly allowed
  OutboundEphemeralPorts:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNetworkAcl
      RuleNumber: 120
      Protocol: 6               # TCP
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  ####################################################################
  # 🔗 Associate NACL with Public Subnet
  ####################################################################
  PublicSubnetNetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref Subnet
      NetworkAclId: !Ref PublicNetworkAcl

######################################################################
# 🌐 Elastic IP (Public-facing IP)
# Used by EC2 instance for stable public access
######################################################################
  WebServerEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      InstanceId: !Ref WebServerInstance




######################################################################
# 🖥 STEP 4: Web Server (EC2) in Public Subnet
# - Public IP enabled
# - HTTP access allowed
# - Uses cfn-init for bootstrapping
######################################################################

  ####################################################################
  # 🔐 Security Group (Stateful – instance level)
  ####################################################################

  InstanceSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupDescription: Enable HTTP via port 80
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
  # TASK 5.1 - BEGIN: Change IP Range to 0.0.0.0/0
          CidrIp: 0.0.0.0/0
  # TASK 5.1 - END

  ####################################################################
  # 🚀 EC2 Web Server Instance
  ####################################################################

  WebServerInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn: AttachGateway

    ##################################################################
    # 📦 CloudFormation Init (Bootstrapping)
    ##################################################################    
    
    
    Metadata:
      Comment: Install a simple application
      'AWS::CloudFormation::Init':
        config:
          packages:
            yum:
              httpd: []
          files:
            /var/www/html/index.html:
              content: !Join 
                - |+

                - - >-
                    <h1>Congratulations, you have successfully deployed a simple
                    infrastructure using AWS CloudFormation.</h1>
              mode: '000644'
              owner: root
              group: root
            /etc/cfn/cfn-hup.conf:
              content: !Join 
                - ''
                - - |
                    [main]
                  - stack=
                  - !Ref 'AWS::StackId'
                  - |+

                  - region=
                  - !Ref 'AWS::Region'
                  - |+

              mode: '000400'
              owner: root
              group: root
            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              content: !Join 
                - ''
                - - |
                    [cfn-auto-reloader-hook]
                  - |
                    triggers=post.update
                  - >
                    path=Resources.WebServerInstance.Metadata.AWS::CloudFormation::Init
                  - 'action=/opt/aws/bin/cfn-init -v '
                  - '         --stack '
                  - !Ref 'AWS::StackName'
                  - '         --resource WebServerInstance '
                  - '         --region '
                  - !Ref 'AWS::Region'
                  - |+

                  - |
                    runas=root
              mode: '000400'
              owner: root
              group: root
          services:
            sysvinit:
              httpd:
                enabled: 'true'
                ensureRunning: 'true'
              cfn-hup:
                enabled: 'true'
                ensureRunning: 'true'
                files:
                  - /etc/cfn/cfn-hup.conf
                  - /etc/cfn/hooks.d/cfn-auto-reloader.conf
     ##################################################################
    # ⚙ Instance Properties
    ##################################################################                 
                  
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      Tags:
        - Key: Application
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: Lab Host
      NetworkInterfaces:
        - GroupSet:
            - !Ref InstanceSecurityGroup
          AssociatePublicIpAddress: 'true'
          DeviceIndex: '0'
          DeleteOnTermination: 'true'
          SubnetId: !Ref Subnet
      UserData: !Base64 
        'Fn::Join':
          - ''
          - - |
              #!/bin/bash -xe
            - |
              yum update -y aws-cfn-bootstrap
            - '/opt/aws/bin/cfn-init -v '
            - '         --stack '
            - !Ref 'AWS::StackName'
            - '         --resource WebServerInstance '
            - '         --region '
            - !Ref 'AWS::Region'
            - |+

            - '/opt/aws/bin/cfn-signal -e $? '
            - '         --stack '
            - !Ref 'AWS::StackName'
            - '         --resource WebServerInstance '
            - '         --region '
            - !Ref 'AWS::Region'
            - |+

    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M

######################################################################
# 🏠 STEP 5: Private Subnet
# - No public IP
# - Used for App / DB servers
######################################################################

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PRIVSUBNET1
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select 
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Private-Subnet-1

##########################################################################################
######################################################################
